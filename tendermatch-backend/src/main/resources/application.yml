server:
  port: ${SPRING_BOOT_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: tendermatch-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/tendermatch}
    username: ${SPRING_DATASOURCE_USERNAME:tendermatch}
    password: ${SPRING_DATASOURCE_PASSWORD:tendermatch_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 150MB

app:
  jwt:
    secret: ${JWT_SECRET:9a6747f3b6c4349479b009eb733a1cc00142b6045610816a7f8ca9b2520bb262}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000} # 1 hour
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket-name: ${MINIO_BUCKET_NAME:tender-pdfs}
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}

logging:
  level:
    com.tendermatch: INFO
    org.springframework.security: INFO
