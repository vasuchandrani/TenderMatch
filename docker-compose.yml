version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tendermatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tendermatch}
      POSTGRES_USER: ${POSTGRES_USER:-tendermatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tendermatch_secret}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tendermatch -d tendermatch"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    container_name: tendermatch-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: tendermatch-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama

  backend:
    build:
      context: ./tendermatch-backend
      dockerfile: Dockerfile
    container_name: tendermatch-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-tendermatch}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-tendermatch}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-tendermatch_secret}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-tender-pdfs}
      AI_SERVICE_URL: http://ai-service:8000
      JWT_SECRET: ${JWT_SECRET:-9a6747f3b6c4349479b009eb733a1cc00142b6045610816a7f8ca9b2520bb262}
      JWT_EXPIRATION_MS: 3600000
      JWT_REFRESH_EXPIRATION_MS: 604800000
    ports:
      - "8080:8080"

  ai-service:
    build:
      context: ./tendermatch-ai
      dockerfile: Dockerfile
    container_name: tendermatch-ai
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tendermatch}:${POSTGRES_PASSWORD:-tendermatch_secret}@postgres:5432/${POSTGRES_DB:-tendermatch}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-tender-pdfs}
      OLLAMA_API_BASE: http://ollama:11434
      PRIMARY_LLM_MODEL: ollama/qwen2.5:7b
      FALLBACK_LLM_MODEL: ollama/qwen2.5:3b
    ports:
      - "8000:8000"
    volumes:
      - model-cache:/app/models

  frontend:
    build:
      context: ./tendermatch-frontend
      dockerfile: Dockerfile
    container_name: tendermatch-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8080

volumes:
  pgdata:
  miniodata:
  ollama-models:
  model-cache:
